; extensions_zk.conf: the dialplan for The Halls of ZK by Telephone.
; Pulled in by one line at the end of extensions.conf:
;
;   #include extensions_zk.conf
;
; Change VAX-ADDRESS below to the VAX running the ZKPHONE service.

; A call for the game.  The script name in the URL, "zk", is the sound
; directory the VAX uses, so the game has no directory name built in.
[zk]
exten => s,1,Answer()
 same => n,Wait(1)
 same => n,AGI(agi://VAX-ADDRESS:4573/zk)
 same => n,Hangup()

; Called by the VAX with GOSUB ifc-say s 1 DIR,NAME, the text in IFC_TEXT.
; The names are checked here as well as in the script, because they are
; also part of a path.  SYSTEMSTATUS tells the VAX whether it worked.
[ifc-say]
exten => s,1,GotoIf($[${REGEX("^[a-z0-9_]+$" ${ARG1})} & ${REGEX("^[a-z0-9_]+$" ${ARG2})}]?ok)
 same => n,Set(SYSTEMSTATUS=FAILURE)
 same => n,Return()
 same => n(ok),Set(FILE(/var/spool/ifc-say/${ARG2}.txt)=${IFC_TEXT})
 same => n,System(/usr/local/bin/ifc-say ${ARG1} ${ARG2})
 same => n,Return()

; Called by the VAX with GOSUB ifc-hear s 1 DIR.  Records the caller
; after a beep, until 3 seconds of silence, 6 seconds in all, or pound;
; then IFC_HEARD is what they said, in capitals, or empty.
; The recording is named for the call, and ifc-hear deletes it.
[ifc-hear]
exten => s,1,Set(IFC_HEARD=)
 same => n,GotoIf($[${REGEX("^[a-z0-9_]+$" ${ARG1})}]?ok)
 same => n,Return()
 same => n(ok),Set(NAME=h${FILTER(0-9,${UNIQUEID})})
 same => n,Record(/var/spool/ifc-hear/${NAME}.wav,3,6)
 same => n,Set(IFC_HEARD=${SHELL(/usr/local/bin/ifc-hear ${ARG1} ${NAME})})
 same => n,Return()

; Calls in from the trunk: whatever number was dialled, it is the game.
; A call over a registration may be addressed to the account name rather
; than the number, hence letters in the pattern.
[from-trunk]
exten => _[+0-9a-zA-Z].,1,Goto(zk,s,1)
exten => s,1,Goto(zk,s,1)

; Softphones on the LAN: dial 9 for the game.  Nothing else, so a stolen
; softphone password cannot make calls out.
[from-lan]
exten => 9,1,Goto(zk,s,1)
