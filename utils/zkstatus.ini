! ZKSTATUS.INI - configuration for ZKSTATUS.COM
!
! key = value, one to a line.  A ! starts a comment, so no value may
! contain one.  Keys are not case sensitive.  This file holds the AMI
! secret: protect it from the world, e.g.
!
!	$ SET SECURITY/PROTECTION=(S:RWED,O:RWED,G,W) ZKSTATUS.INI
!
interval        = 5                     ! minutes between runs
queue           = SYS$BATCH             ! where the next run is queued
mailto          = someone@example.org   ! comma separated; blank for no mail
dir             = WASD_ROOT:[ZK]        ! where STATUS.HTML is written
web             = play.hallsofzk.org:80 ! web server, host[:port]
web_path        = /dclinabox/-/dclinabox.html   ! must answer 2xx or 3xx
asterisk        = frends:5038           ! Asterisk manager (AMI), host[:port]
ami_user        = zkstatus              ! as in manager_zk.conf
ami_secret      = changeme
zkphone_service = yes                   ! ZKPHONE runs on this node: check it
